[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame_engine"
version = "1.3.0"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pygame_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
